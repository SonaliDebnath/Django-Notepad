{% extends "notes/base.html" %}

{% block content %}
<div class="form-container animate-in">
    <div class="page-header">
        <h1 class="page-title">{% if note %}<span class="highlight">Edit</span> Note{% else %}<span class="highlight">New</span> Note{% endif %}</h1>
    </div>

    <form method="post" class="glass-form" id="noteForm">
        {% csrf_token %}

        <div class="form-group">
            <label for="title" class="form-label">Title</label>
            <input type="text" name="title" id="title" class="form-input"
                   placeholder="Give your note a title..."
                   value="{{ note.title|default:'' }}" required autofocus>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label class="form-label">Content</label>
                <span id="wordCount" class="form-label" style="text-transform: none; letter-spacing: 0; font-size: 11px;">0 words</span>
            </div>

            <!-- Formatting Toolbar -->
            <div class="formatting-toolbar">
                <button type="button" id="btnBold" data-command="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                <button type="button" id="btnItalic" data-command="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                <button type="button" id="btnUnderline" data-command="underline" title="Underline (Ctrl+U)"><u>U</u></button>
                <span class="toolbar-separator"></span>
                <span class="toolbar-hint">
                    <span class="kbd">Ctrl</span>+<span class="kbd">B</span>
                    <span class="kbd">I</span>
                    <span class="kbd">U</span>
                </span>
            </div>

            <!-- Contenteditable Editor -->
            <div class="editor-area" id="editor" contenteditable="true" data-placeholder="Start writing...">{% if note %}{{ note.body|safe }}{% endif %}</div>

            <!-- Hidden input to carry HTML on submit -->
            <input type="hidden" name="body" id="bodyInput">
        </div>

        <div class="form-group">
            <label class="form-label">Color Tag</label>
            <div class="color-picker">
                <label class="color-option co-blue {% if not note or note.color_tag == 'blue' %}selected{% endif %}" id="opt-blue" title="Blue" aria-label="Blue">
                    <input type="radio" name="color_tag" value="blue" {% if not note or note.color_tag == 'blue' %}checked{% endif %} onchange="selectColor('blue')">
                </label>
                <label class="color-option co-purple {% if note.color_tag == 'purple' %}selected{% endif %}" id="opt-purple" title="Purple" aria-label="Purple">
                    <input type="radio" name="color_tag" value="purple" {% if note.color_tag == 'purple' %}checked{% endif %} onchange="selectColor('purple')">
                </label>
                <label class="color-option co-cyan {% if note.color_tag == 'cyan' %}selected{% endif %}" id="opt-cyan" title="Cyan" aria-label="Cyan">
                    <input type="radio" name="color_tag" value="cyan" {% if note.color_tag == 'cyan' %}checked{% endif %} onchange="selectColor('cyan')">
                </label>
                <label class="color-option co-pink {% if note.color_tag == 'pink' %}selected{% endif %}" id="opt-pink" title="Pink" aria-label="Pink">
                    <input type="radio" name="color_tag" value="pink" {% if note.color_tag == 'pink' %}checked{% endif %} onchange="selectColor('pink')">
                </label>
                <label class="color-option co-green {% if note.color_tag == 'green' %}selected{% endif %}" id="opt-green" title="Green" aria-label="Green">
                    <input type="radio" name="color_tag" value="green" {% if note.color_tag == 'green' %}checked{% endif %} onchange="selectColor('green')">
                </label>
                <label class="color-option co-orange {% if note.color_tag == 'orange' %}selected{% endif %}" id="opt-orange" title="Orange" aria-label="Orange">
                    <input type="radio" name="color_tag" value="orange" {% if note.color_tag == 'orange' %}checked{% endif %} onchange="selectColor('orange')">
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if note %}Update Note{% else %}Create Note{% endif %}
            </button>
            <a href="{% url 'note_list' %}" class="cancel-link">Cancel</a>
        </div>
    </form>
</div>

<script>
function selectColor(color) {
    document.querySelectorAll('.color-option').forEach(function(el) { el.classList.remove('selected'); });
    document.getElementById('opt-' + color).classList.add('selected');
}

(function() {
    var editor = document.getElementById('editor');
    var bodyInput = document.getElementById('bodyInput');
    var wordCountEl = document.getElementById('wordCount');
    var form = document.getElementById('noteForm');

    // Toolbar buttons
    var btnBold = document.getElementById('btnBold');
    var btnItalic = document.getElementById('btnItalic');
    var btnUnderline = document.getElementById('btnUnderline');

    // Apply formatting command
    function execFormat(command) {
        document.execCommand(command, false, null);
        editor.focus();
        updateToolbarState();
    }

    btnBold.addEventListener('click', function() { execFormat('bold'); });
    btnItalic.addEventListener('click', function() { execFormat('italic'); });
    btnUnderline.addEventListener('click', function() { execFormat('underline'); });

    // Update active state of toolbar buttons
    function updateToolbarState() {
        btnBold.classList.toggle('active', document.queryCommandState('bold'));
        btnItalic.classList.toggle('active', document.queryCommandState('italic'));
        btnUnderline.classList.toggle('active', document.queryCommandState('underline'));
    }

    // Update word count
    function updateWordCount() {
        var text = (editor.innerText || '').trim();
        var count = text ? text.split(/\s+/).length : 0;
        wordCountEl.textContent = count + ' word' + (count !== 1 ? 's' : '');
    }

    // Listen for selection changes to update toolbar state
    document.addEventListener('selectionchange', function() {
        if (editor.contains(document.activeElement) || editor === document.activeElement) {
            updateToolbarState();
        }
    });

    editor.addEventListener('input', updateWordCount);
    editor.addEventListener('keyup', updateToolbarState);

    // Sync editor content to hidden input on form submit
    form.addEventListener('submit', function(e) {
        var content = editor.innerHTML.trim();
        // Treat empty editor as no content
        if (!content || content === '<br>' || content === '<div><br></div>') {
            // Prevent submit if empty — add required-like behavior
            e.preventDefault();
            editor.focus();
            return;
        }
        bodyInput.value = content;
    });

    // Initialize
    updateWordCount();
    updateToolbarState();
})();
</script>
{% endblock %}
