<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }} — NeoNote</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #f5f5f0;
            --bg-card: rgba(255, 255, 255, 0.75);
            --accent-blue: #0096c7;
            --accent-purple: #7b5cff;
            --accent-cyan: #00b4d8;
            --accent-pink: #e05090;
            --accent-green: #00b368;
            --accent-orange: #e07800;
            --text-primary: #1a1a2e;
            --text-secondary: #555566;
            --text-muted: #888899;
            --border-glass: rgba(0, 0, 0, 0.07);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 150, 199, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 199, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 750px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 32px;
        }

        .shared-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.04);
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            margin-bottom: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            animation: fadeInUp 0.5s ease forwards;
        }

        .color-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-glass);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        .body {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .word-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.04);
            padding: 2px 8px;
            border-radius: 50px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">NeoNote</div>
        <div style="text-align: center; margin-bottom: 24px;">
            <span class="shared-badge">&#128279; Shared Note</span>
        </div>
        <div class="card">
            <div style="margin-bottom: 8px;">
                <span class="color-dot" style="background: var(--accent-{{ note.color_tag }});"></span>
            </div>
            <h1 class="title">{{ note.title }}</h1>
            <div class="meta">
                <span>{{ note.created_at|date:"M d, Y" }}</span>
                <span class="word-badge">{{ note.word_count }} words</span>
            </div>
            <div class="body">{{ note.body }}</div>
        </div>
    </div>
</body>
</html>
